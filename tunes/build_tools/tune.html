<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css"/>
  <script src="../nav.js" type="text/javascript"></script>
  <link rel="stylesheet" href="../dist/abcjs-audio.css"/>

  <title>$title</title>
  <style>
    #abc {
      background-color: #000000;
      color: #ffffff;
    }
    #paper,
    #audio,
    #abc {
      background-color: #000000;
    }
    #paper,
    #audio {
      color: #ffffff;
    }
  </style>
  <script src="../dist/abcjs-basic.js" type="text/javascript" defer></script>
  <script type="text/javascript">
    function loadTunePage() {
      var abcSource = document.getElementById("abc-source");
      if (!abcSource || !window.ABCJS) {
        return;
      }

      var abc = abcSource.textContent || "";
      var visualObj = ABCJS.renderAbc("paper", abc, {
        add_classes: true,
        responsive: "resize"
      })[0];

      var deferAudioSetup = window.requestIdleCallback || function (cb) { setTimeout(cb, 120); };
      deferAudioSetup(function () {
        if (!ABCJS.synth.supportsAudio() || !visualObj) {
          return;
        }

        var synthControl = new ABCJS.synth.SynthController();
        synthControl.load("#audio", null, {
          displayLoop: true,
          displayRestart: true,
          displayPlay: true,
          displayProgress: true,
          displayWarp: true
        });

        var synth = new ABCJS.synth.CreateSynth();
        synth.init({ visualObj: visualObj }).then(function () {
          synthControl.setTune(visualObj, false);
        }).catch(function () {
          var audio = document.getElementById("audio");
          if (audio) {
            audio.textContent = "Audio playback unavailable on this device/browser.";
          }
        });
      });
    }

    window.addEventListener("DOMContentLoaded", loadTunePage);
  </script>
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="../index.html">johnmichaelmurner.com</a>

      <a href="../chords/index.html">Chords</a>
      <a href="../lexingtionopencontraband/index.html">Open Band Tunes</a>
    </nav>
  </header>
  <div class="container">
    <hr>
    <div id="paper"></div>
    <div id="audio"></div>
    <script id="abc-source" type="text/plain">
$abc
    </script>
  </div>
</body>
</html>
