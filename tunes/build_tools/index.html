<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css"/>
	<script src="../nav.js" type="text/javascript"></script>
	<title>Tunes</title>
	<script src="abcjs/dist/abcjs-basic.js" type="text/javascript"></script>
  <script>

    function myFunction() {
        var input, filter, table, tr, td, i, txtValue;
        input = document.getElementById("myInput");
        filter = input.value.toUpperCase();
        table = document.getElementById("myTable");
        tr = table.getElementsByTagName("tr");
        for (i = 0; i < tr.length; i++) {
          td = tr[i].getElementsByTagName("td")[0];
          if (td) {
            txtValue = td.textContent || td.innerText;
            if (txtValue.toUpperCase().indexOf(filter) > -1) {
              tr[i].style.display = "";
            } else {
              tr[i].style.display = "none";
            }
          }       
        }
      }</script>
</head>
<body>
    <header class="site-header">
      <a class="site-brand" href="../index.html">johnmichaelmurner.com</a>
      <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
        <span class="hamburger-icon" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Tunes</a>
        <a href="../chords/index.html">Chords</a>
        <a href="../lexingtionopencontraband/index.html">Open Band Tunes</a>
      </nav>
    </header>
    <div class="container">
      <input type="text" id="myInput" onkeyup="myFunction()" placeholder="Search for names.." title="Type in a name">
      <table id="myTable">
      $tunes
      </table>
    </div>
</body>
</html>
