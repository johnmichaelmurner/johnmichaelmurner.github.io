<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" type="image/x-icon"/>
  <link rel="stylesheet" href="style.css"/>
	<title>John Michael Murner</title>
	<script src="abcjs/dist/abcjs-basic.js" type="text/javascript"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hammersmith+One&display=swap');

    body {
      margin: 0;
      background-color: #131516;
      background-image: url('images/TopoMap.png');
      background-size: cover;
      background-attachment: fixed;
      color: #ffffff;
      font-family: 'Hammersmith One', sans-serif;
      padding-top: 60px; /* Space for the fixed toolbar */
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background-color: #2f4f4f;
      border-bottom: 1px solid #406666;
      display: flex;
      align-items: center;
      padding: 0 30px;
      box-shadow: 0 2px 15px rgba(0,0,0,0.8);
      z-index: 1000;
    }
    header a {
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      letter-spacing: 1.5px;
      font-size: 13px;
      text-transform: uppercase;
      margin-right: 40px;
      transition: color 0.3s ease;
    }
    header a:hover {
      color: #00fbff;
      text-shadow: 0 0 12px rgba(0, 251, 255, 0.6);
    }
    #tunes {
      padding: 60px 20px;
      max-width: 800px;
      margin: 0 auto;
      list-style-type: none;
    }
    #tunes a {
      display: block;
      background-color: #2f4f4f;
      border: 1px solid #406666;
      padding: 30px;
      margin-bottom: 25px;
      border-radius: 6px;
      text-decoration: none;
      color: #00fbff;
      font-size: 22px;
      font-weight: 300;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease;
    }
    #tunes a:hover {
      transform: scale(1.02);
      border-color: #00fbff;
      color: #ffffff;
      background-color: #385a5a;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 50px;
      text-align: center;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
<header>
    <a href="index.html">johnmichaelmurner.com</a>
    <a href="index.html">Home</a>
    <a href="tunes/index.html">Tunes</a>

</header>
<ul style="list-style-type:none;" id="tunes">

        </div>  
    </a>

</ul>
